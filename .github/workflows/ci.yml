# Public CI, mirroring the checks the client is released under.
#
# The three packages depend on each other, and CI tests the working tree rather
# than a release, so every job installs them from source in dependency order:
# connectors, then the relational driver, then the client. Installing the
# client alone would resolve its siblings from the index and test a release
# instead of this commit. Backend extras are installed so their tests import
# rather than failing at collection; tests needing a live warehouse still skip.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LINT_PATHS: >-
    packages/kumo-relational-engine/src packages/kumo-relational-engine/tests
    packages/kumo-relational-engine/examples
    packages/kumo-relational-client/src packages/kumo-relational-client/tests
    packages/kumo-connectors/src
    packages/kumo-connectors/tests
    e2e scripts examples

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff==0.16.*'
      - name: Assert every lint path resolves to at least one file
        run: |
          for path in $LINT_PATHS; do
            count=$(ruff check --show-files "$path" | wc -l)
            echo "$path: $count files"
            if [ "$count" -eq 0 ]; then
              echo "ERROR: ruff matched no files under $path"
              exit 1
            fi
          done
      - run: ruff check $LINT_PATHS
      - run: ruff format --check --diff $LINT_PATHS
      - name: Every package ships the licence and notice
        run: |
          for pkg in packages/*/; do
            for f in LICENSE NOTICE; do
              if ! cmp -s "$f" "$pkg$f"; then
                echo "ERROR: $pkg$f differs from the repo-root $f"
                exit 1
              fi
            done
          done

  connectors-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --editable
          './packages/kumo-connectors[sqlite,duckdb,s3,test]'
      - run: python -m pytest packages/kumo-connectors/tests -q

  databricks-contract-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sql-connector: '==4.0.3'
            sdk: '==0.68.0'
          - sql-connector: '>=4,<5'
            sdk: '>=0.68,<1.0'
    env:
      WITH_RELATIONALLIB: '0'
      DATABRICKS_SQL_CONNECTOR_SPEC: ${{ matrix.sql-connector }}
      DATABRICKS_SDK_SPEC: ${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Exercise both declared floors and the latest supported dependencies.
      - run: >-
          python -m pip install
          "databricks-sql-connector${DATABRICKS_SQL_CONNECTOR_SPEC}"
          "databricks-sdk${DATABRICKS_SDK_SPEC}"
      - run: python -m pip install --editable './packages/kumo-connectors'
      # Prove the base connector and selected driver versions import cleanly
      # before the broader test dependency set is installed.
      - run: python -c "import kumo_connectors.backends.databricks"
      - run: >-
          python -m pip install --editable
          './packages/kumo-connectors[sqlite,duckdb,databricks,s3,test]'
      - run: python -m pytest packages/kumo-connectors/tests -q
      - run: >-
          python -m pip install --editable
          './packages/kumo-relational-engine[test]'
      - run: >-
          python -m pytest tests/client/test_databricks_serving.py -q
        working-directory: packages/kumo-relational-engine

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: >-
          python -m pip install --editable
          './packages/kumo-connectors[sqlite,duckdb]'
      - run: >-
          python -m pip install --editable
          './packages/kumo-relational-client[sqlite,duckdb,test]'
      - run: python -c "import kumo_relational_client; from kumo_relational_client import relational"
      - run: >-
          python -m pytest packages/kumo-relational-client/tests
          -m 'not live_nim' -q

  relational-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build
      - run: >-
          python -m pip install --editable
          './packages/kumo-connectors[databricks,duckdb]'
      - run: >-
          python -m pip install --editable
          './packages/kumo-relational-engine[test,explain,databricks,databricks-serving,duckdb]'
      - run: >-
          python -c "import kumo_relational_engine.relationallib as relationallib;
          assert hasattr(relationallib.NeighborSampler, 'seed')"
      - run: python -m pytest tests --quiet --disable-warnings -m 'not live_nim'
        working-directory: packages/kumo-relational-engine

  relational-contract-tests:
    runs-on: ubuntu-latest
    env:
      WITH_RELATIONALLIB: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --editable './packages/kumo-connectors'
      - run: >-
          python -m pip install --editable
          './packages/kumo-relational-engine[test]'
      - run: >-
          python -m pytest tests/client/test_rfm_nim_contract.py
          tests/client/test_rfm_nim_hardening_cases.py
          tests/client/test_rfm_nim_live_harness.py
          tests/client/test_rfm_serving_init.py -q
        working-directory: packages/kumo-relational-engine

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake ninja-build
      - run: >-
          python -m pip install --editable
          './packages/kumo-connectors[sqlite,duckdb]'
      - run: python -m pip install --editable './packages/kumo-relational-engine'
      - run: >-
          python -m pip install --editable
          './packages/kumo-relational-client[relational,sqlite,duckdb,test]'
      - run: >-
          python -c "import kumo_relational_client; from kumo_relational_client import relational;
          import kumo_relational_engine.relationallib as k;
          assert hasattr(k.NeighborSampler, 'seed'); relational.Graph;
          assert not hasattr(relational, 'KumoRelational')"
      - run: >-
          python -m pytest packages/kumo-relational-client/tests
          -m 'not live_nim' -q

  wheels:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      WITH_RELATIONALLIB: '1'
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: |
          for PYTAG in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313; do
            "/opt/python/${PYTAG}/bin/python" -m pip install --upgrade pip build
            "/opt/python/${PYTAG}/bin/python" -m build --wheel \
              --outdir wheelhouse packages/kumo-relational-engine
          done
          for wheel in wheelhouse/kumo_relational_engine-*.whl; do
            auditwheel repair "$wheel" --wheel-dir dist
          done
          /opt/python/cp312-cp312/bin/python -m pip install twine
          /opt/python/cp312-cp312/bin/python -m twine check dist/*
      - run: test "$(find dist -name '*.tar.gz' | wc -l)" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl

  wheel-imports:
    needs: wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - run: python -m pip install ./packages/kumo-connectors
      - run: python -m pip install dist/kumo_relational_engine-*-cp$(echo "${{ matrix.python }}" | tr -d .)-*.whl
      - run: >-
          python -c "import kumo_relational_engine.relationallib as relationallib;
          assert hasattr(relationallib.NeighborSampler, 'seed')"
      - run: python -c "from kumo_relational_engine.rfm import Graph, KumoRelational"
