# Public CI. Mirrors the checks the SDK was released under: lint, the three
# test suites, and a manylinux wheel that has to import on every Python the
# packages claim to support.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every first-party Python tree. This is an explicit list rather than `.`
  # because a path that matches no file makes ruff pass vacuously.
  LINT_PATHS: >-
    packages/nemotron-relational/src packages/nemotron-relational/tests
    packages/nemotron-relational/examples
    packages/nemotron-predict-client/src packages/nemotron-predict-client/tests
    packages/nemotron-predict-connectors/src
    packages/nemotron-predict-connectors/tests
    e2e scripts examples

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned: an unpinned linter turns an upstream release into a red build.
      - run: python -m pip install 'ruff==0.16.*'
      - name: Assert every lint path resolves to at least one file
        run: |
          for path in $LINT_PATHS; do
            count=$(ruff check --show-files "$path" | wc -l)
            echo "$path: $count files"
            if [ "$count" -eq 0 ]; then
              echo "ERROR: ruff matched no files under $path"
              exit 1
            fi
          done
      - run: ruff check $LINT_PATHS
      # The formatter owns line length and quote style, so E501 is off in the
      # lint rules and this is what enforces them.
      - run: ruff format --check --diff $LINT_PATHS
      - name: Every package ships the licence and notice
        run: |
          for pkg in packages/*/; do
            for f in LICENSE NOTICE; do
              if ! cmp -s "$f" "$pkg$f"; then
                echo "ERROR: $pkg$f differs from the repo-root $f"
                exit 1
              fi
            done
          done

  client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './packages/nemotron-predict-client[test]'
      - run: >-
          python -m pytest packages/nemotron-predict-client/tests
          -m 'not live_nim' -q

  connectors-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './packages/nemotron-predict-connectors[test]'
      - run: python -m pytest packages/nemotron-predict-connectors/tests -q

  relational-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The explain extra pulls in `openai`. Without it a block of tests skips
      # silently, which is how a broken explain path reaches a release.
      - run: |
          python -m pip install -e './packages/nemotron-predict-connectors'
          python -m pip install -e './packages/nemotron-relational[test,explain]'
      # Some tests invoke scripts/ and read paths relative to the working
      # directory, so they run from the package root.
      - run: python -m pytest tests -m 'not live_nim' -q
        working-directory: packages/nemotron-relational

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the manylinux wheels
        run: |
          docker run --rm -v "$PWD":/io -w /io/packages/nemotron-relational \
            quay.io/pypa/manylinux_2_28_x86_64 \
            /bin/bash -c '/opt/python/cp312-cp312/bin/pip wheel . -w /io/wheelhouse --no-deps'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheelhouse/*.whl

  wheel-imports:
    needs: wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheelhouse
      - name: Install the built wheel and import it
        run: |
          python -m pip install ./packages/nemotron-predict-connectors
          python -m pip install --no-index --find-links wheelhouse nemotron-relational \
            || python -m pip install wheelhouse/*.whl
          python -c "import nemotron_relational; print(nemotron_relational.__version__)"
