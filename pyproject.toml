# Workspace root for the nvidia-sdfm monorepo. This builds no package; each
# independently released distribution lives under packages/ with its own
# pyproject.toml:
#
#   packages/nvidia-sdfm     - the client SDK (pure-python)
#   packages/sdfm-connectors - shared data-source connectors (pure-python)
#   packages/kumorfm         - the KumoRFM driver (native build)
#
# This file carries only shared tooling configuration. Each package's
# [tool.ruff] extends this file, so the lint baseline below applies to every
# first-party tree and a package cannot drop rules by shadowing the block.

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
