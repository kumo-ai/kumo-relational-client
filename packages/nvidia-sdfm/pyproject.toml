[project]
name = "nvidia-sdfm"
dynamic = ["version"]
authors = [
    {name = "NVIDIA"},
]
description = "Client SDK for NVIDIA structured-data foundation model NIMs (TabICL, Kumo-RFM, and future adapters)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "structured-data",
    "foundation-model",
    "tabular",
    "relational",
]
dependencies = [
    "requests>=2.28",
    "pandas>=2.0",
    "sdfm-connectors>=0.2,<1",
]

[project.optional-dependencies]
kumorfm = [
    "kumorfm>=2.23,<3",
]
sqlite = [
    "sdfm-connectors[sqlite]",
]
duckdb = [
    "sdfm-connectors[duckdb]",
]
snowflake = [
    "sdfm-connectors[snowflake]",
]
databricks = [
    "sdfm-connectors[databricks]",
]
s3 = [
    "sdfm-connectors[s3]",
]
all = [
    "nvidia-sdfm[kumorfm,sqlite,duckdb,snowflake,databricks,s3]",
]
test = [
    "pytest",
    "pytest-mock",
    "requests-mock",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nvidia_sdfm*"]

[tool.setuptools.dynamic]
version = {attr = "nvidia_sdfm._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
markers = [
    "live_nim: opt-in live TFM NIM tests using SDFM_NIM_BASE_URL",
]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
