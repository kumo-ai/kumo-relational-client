[project]
name = "nvidia-sdfm"
dynamic = ["version"]
authors = [
    {name = "NVIDIA"},
]
description = "Client SDK for NVIDIA structured-data foundation model NIMs (TabICL, Kumo-RFM, and future adapters)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "structured-data",
    "foundation-model",
    "tabular",
    "relational",
]
# Only the interpreter versions CI builds and tests; see `requires-python`.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "numpy>=1.24",
    "pandas>=2.0",
    "sdfm-connectors>=0.3,<1",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/nvidia-sdfm-sdk"
Source = "https://github.com/NVIDIA/nvidia-sdfm-sdk"
Issues = "https://github.com/NVIDIA/nvidia-sdfm-sdk/issues"

[project.optional-dependencies]
kumorfm = [
    "kumorfm>=2.24,<3",
]
sqlite = [
    "sdfm-connectors[sqlite]",
]
duckdb = [
    "sdfm-connectors[duckdb]",
]
snowflake = [
    "sdfm-connectors[snowflake]",
]
databricks = [
    "sdfm-connectors[databricks]",
]
# Invoking a served model, as opposed to `databricks` above, which is SQL data
# access. Kept distinct so neither drags in the other.
databricks-serving = [
    "kumorfm[databricks-serving]>=2.23,<3",
]
s3 = [
    "sdfm-connectors[s3]",
]
# Deliberately not part of `all`: the explanation summary POSTs row data to a
# third-party LLM endpoint, so installing it stays an explicit opt-in.
explain = [
    "kumorfm[explain]>=2.24,<3",
]
relbench = [
    "kumorfm[relbench]>=2.24,<3",
]
all = [
    "nvidia-sdfm[kumorfm,sqlite,duckdb,snowflake,databricks,databricks-serving,s3]",
]
test = [
    "pytest",
    "pytest-mock",
    "requests-mock",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nvidia_sdfm*"]

[tool.setuptools.package-data]
"nvidia_sdfm" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "nvidia_sdfm._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
markers = [
    "live_nim: opt-in live TFM NIM tests using SDFM_NIM_BASE_URL",
]

[tool.ruff]
# Inherit the workspace lint baseline so this package cannot silently opt out of
# it; see the root pyproject.toml for the shared rule set.
extend = "../../pyproject.toml"
line-length = 80
target-version = "py310"
