[project]
name = "sdfm-connectors"
dynamic = ["version"]
authors = [
    {name = "NVIDIA"},
]
description = "Shared data-source connectors (connect, read, SQL quoting) for the nvidia-sdfm SDK and its engines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "structured-data",
    "connectors",
    "sql",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/nvidia-sdfm-sdk"
Source = "https://github.com/NVIDIA/nvidia-sdfm-sdk"
Issues = "https://github.com/NVIDIA/nvidia-sdfm-sdk/issues"

[project.optional-dependencies]
sqlite = [
    "adbc-driver-sqlite",
]
duckdb = [
    "duckdb>=1.5.0",
]
snowflake = [
    "snowflake-connector-python",
]
databricks = [
    "databricks-sql-connector>=3.0.0",
]
s3 = [
    "s3fs>=2023.12.0",
]
all = [
    "sdfm-connectors[sqlite,duckdb,snowflake,databricks,s3]",
]
test = [
    "pytest",
    "moto[server]>=5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sdfm_connectors*"]

[tool.setuptools.package-data]
"sdfm_connectors" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "sdfm_connectors.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
# Inherit the workspace lint baseline so this package cannot silently opt out of
# it; see the root pyproject.toml for the shared rule set.
extend = "../../pyproject.toml"
line-length = 80
target-version = "py310"
