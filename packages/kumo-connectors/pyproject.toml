[project]
name = "kumo-connectors"
dynamic = ["version"]
authors = [
    {name = "NVIDIA"},
]
description = "Shared data-source connectors (connect, read, SQL quoting) for the kumo-relational-client and its engines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "structured-data",
    "connectors",
    "sql",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/kumo-relational-client"
Source = "https://github.com/NVIDIA/kumo-relational-client"
Issues = "https://github.com/NVIDIA/kumo-relational-client/issues"

[project.optional-dependencies]
sqlite = [
    "adbc-driver-sqlite",
]
duckdb = [
    "duckdb>=1.5.0",
]
snowflake = [
    "snowflake-connector-python",
]
databricks = [
    # `user_agent_entry` became the public partner-attribution parameter in
    # 4.0.1. Versions through 4.0.2 import an undeclared dependency, so use
    # the first release that both supports attribution and imports cleanly.
    "databricks-sql-connector>=4.0.3,<5",
]
postgres = [
    "psycopg[binary]>=3.1",
]
s3 = [
    "s3fs>=2023.12.0",
]
all = [
    "kumo-connectors[sqlite,duckdb,snowflake,databricks,postgres,s3]",
]
test = [
    "pytest",
    "moto[server]>=5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kumo_connectors*"]

[tool.setuptools.package-data]
"kumo_connectors" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "kumo_connectors._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
# An xfail that starts passing is a fixed bug, and should fail the run so it
# gets un-marked rather than sitting there silently.
xfail_strict = true

[tool.ruff]
# Inherit the workspace lint baseline so this package cannot silently opt out of
# it; see the root pyproject.toml for the shared rule set.
extend = "../../pyproject.toml"
line-length = 80
target-version = "py310"
