[project]
name = "nemotron-predict-client"
dynamic = ["version"]
authors = [
    {name = "NVIDIA"},
]
description = "Client client for NVIDIA structured-data foundation model NIMs (Nemotron Tabular, Nemotron Relational, and future adapters)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "structured-data",
    "foundation-model",
    "tabular",
    "relational",
]
# Only the interpreter versions CI builds and tests; see `requires-python`.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "numpy>=1.24",
    "pandas>=2.0",
    "nemotron-predict-connectors>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/nemotron-predict-client"
Source = "https://github.com/NVIDIA/nemotron-predict-client"
Issues = "https://github.com/NVIDIA/nemotron-predict-client/issues"

[project.optional-dependencies]
relational = [
    "nemotron-relational>=1.0,<2",
]
sqlite = [
    "nemotron-predict-connectors[sqlite]",
]
duckdb = [
    "nemotron-predict-connectors[duckdb]",
]
snowflake = [
    "nemotron-predict-connectors[snowflake]",
]
databricks = [
    "nemotron-predict-connectors[databricks]",
]
# Invoking a served model, as opposed to `databricks` above, which is SQL data
# access. Kept distinct so neither drags in the other.
databricks-serving = [
    "nemotron-relational[databricks-serving]>=1.0,<2",
]
# Invoking a served model, as opposed to `snowflake` above, which is SQL data
# access. Kept distinct so neither drags in the other.
snowflake-serving = [
    "nemotron-relational[snowflake-serving]>=1.0,<2",
]
s3 = [
    "nemotron-predict-connectors[s3]",
]
# Deliberately not part of `all`: the explanation summary POSTs row data to a
# third-party LLM endpoint, so installing it stays an explicit opt-in.
explain = [
    "nemotron-relational[explain]>=1.0,<2",
]
relbench = [
    "nemotron-relational[relbench]>=1.0,<2",
]
all = [
    "nemotron-predict-client[relational,sqlite,duckdb,snowflake,databricks,databricks-serving,s3]",
]
test = [
    "pytest",
    "pytest-mock",
    "requests-mock",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nemotron_predict*"]

[tool.setuptools.package-data]
"nemotron_predict" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "nemotron_predict._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
# An xfail that starts passing is a fixed bug, and should fail the run so it
# gets un-marked rather than sitting there silently.
xfail_strict = true
markers = [
    "live_nim: opt-in live TFM NIM tests using NEMOTRON_PREDICT_NIM_BASE_URL",
]

[tool.ruff]
# Inherit the workspace lint baseline so this package cannot silently opt out of
# it; see the root pyproject.toml for the shared rule set.
extend = "../../pyproject.toml"
line-length = 80
target-version = "py310"
